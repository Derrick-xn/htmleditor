<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrapesJS 可视化页面构建器演示</title>
    
    <!-- GrapesJS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <!-- GrapesJS 预设插件 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/grapesjs-preset-webpage/dist/grapesjs-preset-webpage.min.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #f5f5f5;
        }
        .header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn-view {
            background-color: #2196F3;
        }
        .btn-view:hover {
            background-color: #0b7dda;
        }
        .btn-clear {
            background-color: #f44336;
        }
        .btn-clear:hover {
            background-color: #d32f2f;
        }
        #gjs {
            height: calc(100vh - 50px);
            overflow: hidden;
        }
        /* 自定义GrapesJS样式 */
        .gjs-one-bg {
            background-color: #2c3e50;
        }
        .gjs-two-color {
            color: #ecf0f1;
        }
        .gjs-four-color {
            color: #4CAF50;
        }
        .gjs-four-color-h:hover {
            color: #45a049;
        }
        /* 弹出层样式 */
        #code-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .code-container {
            width: 80%;
            height: 70%;
            background-color: white;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f1f1f1;
            border-bottom: 1px solid #ddd;
        }
        .code-tabs {
            display: flex;
            gap: 10px;
        }
        .code-tab {
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 4px;
        }
        .code-tab.active {
            background-color: #4CAF50;
            color: white;
        }
        .code-content {
            flex-grow: 1;
            overflow: auto;
            padding: 20px;
        }
        pre {
            margin: 0;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        .close-btn {
            background-color: transparent;
            border: none;
            color: #333;
            font-size: 24px;
            cursor: pointer;
        }
        /* 响应式设计工具栏 */
        .device-manager {
            display: flex;
            gap: 10px;
            margin-right: 20px;
        }
        .device-btn {
            background-color: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.7;
        }
        .device-btn:hover,
        .device-btn.active {
            opacity: 1;
        }
    </style>
</head>
<body>

        <h1>GrapesJS 可视化页面构建器</h1>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 屏蔽 GrapesJS 遥测上报，避免 400(Bad Request)
            (function disableTelemetry() {
                var BLOCK_URL = 'app.grapesjs.com/api/gjs/telemetry/collect';
                try {
                    if (navigator && typeof navigator.sendBeacon === 'function') {
                        var originalBeacon = navigator.sendBeacon.bind(navigator);
                        navigator.sendBeacon = function(url, data) {
                            try {
                                if (typeof url === 'string' && url.indexOf(BLOCK_URL) !== -1) {
                                    return true;
                                }
                            } catch (_) {}
                            return originalBeacon(url, data);
                        };
                    }
                } catch (_) {}
                try {
                    if (window.fetch) {
                        var originalFetch = window.fetch.bind(window);
                        window.fetch = function(input, init) {
                            try {
                                var url = (typeof input === 'string') ? input : (input && input.url);
                                if (url && url.indexOf(BLOCK_URL) !== -1) {
                                    return Promise.resolve(new Response('{}', { status: 204, headers: { 'Content-Type': 'application/json' } }));
                                }
                            } catch (_) {}
                            return originalFetch(input, init);
                        };
                    }
                } catch (_) {}
            })();
            // 工具函数：动态加载脚本
            function loadScript(url) {
                return new Promise(function(resolve, reject) {
                    var s = document.createElement('script');
                    s.src = url;
                    s.onload = resolve;
                    s.onerror = reject;
                    document.head.appendChild(s);
                });
            }

            // 工具函数：将占位/跨域图片替换成内联 SVG，避免导出时报错或空白
            function replaceImagesWithInlinePlaceholders(container) {
                var images = container.querySelectorAll('img');
                images.forEach(function(img) {
                    try {
                        var src = img.getAttribute('src') || '';
                        var isRemote = /^https?:\/\//i.test(src);
                        var isPlaceholder = src.indexOf('via.placeholder.com') >= 0;
                        if (isRemote) {
                            var rect = img.getBoundingClientRect();
                            var w = Math.max(50, Math.round(rect.width || parseInt(img.getAttribute('width')) || 300));
                            var h = Math.max(30, Math.round(rect.height || parseInt(img.getAttribute('height')) || 150));
                            var svg = "data:image/svg+xml;utf8," +
                                encodeURIComponent(
                                    "<svg xmlns='http://www.w3.org/2000/svg' width='" + w + "' height='" + h + "'>" +
                                    "<rect width='100%' height='100%' fill='" + (isPlaceholder ? '#dddddd' : '#9aa7b1') + "'/>" +
                                    "<text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='" + Math.round(Math.min(w, h) / 6) + "'>" + (img.alt || 'image') + "</text>" +
                                    "</svg>"
                                );
                            img.setAttribute('src', svg);
                            img.removeAttribute('srcset');
                            img.removeAttribute('crossorigin');
                        }
                    } catch (_) {}
                });
            }
            // 初始化 GrapesJS 编辑器
            var editor = grapesjs.init({

                styleManager: {
                    sectors: [
                        {

                                { name: 'font-weight', property: 'font-weight' },
                                { name: 'letter-spacing', property: 'letter-spacing' },

                            ]
                        },

                                { name: 'background', property: 'background' },
                                { name: 'border-radius', property: 'border-radius' },
                                { name: 'border', property: 'border' },
                                { name: 'box-shadow', property: 'box-shadow' },

                                { name: 'order', property: 'order' },

                                { name: 'flex-grow', property: 'flex-grow' },
                                { name: 'flex-shrink', property: 'flex-shrink' }
                            ]

                plugins: [

                    },

                },
                canvas: {

                        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css',
                        'https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css'
                    ],
                    scripts: [
                        'https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js'
                    ]
                }
            });

            // 添加示例内容
            editor.setComponents(`
                <div class="container py-5">
                    <header class="text-center mb-5">
                        <h1>企业官网示例</h1>
                        <p class="lead">使用GrapesJS构建的响应式网站模板</p>

                        <div class="col-md-4 mb-4">
                            <div class="card h-100">
                                <div class="card-body text-center">
                                    <i class="fas fa-shield-alt fa-3x text-primary mb-3"></i>
                                    <h3 class="card-title">安全可靠</h3>
                                    <p class="card-text">我们提供全方位的安全保障，确保您的数据和业务始终受到保护。</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 mb-4">
                            <div class="card h-100">
                                <div class="card-body text-center">
                                    <i class="fas fa-headset fa-3x text-primary mb-3"></i>
                                    <h3 class="card-title">全天候支持</h3>
                                    <p class="card-text">我们的技术团队随时为您提供专业支持，解决您在使用过程中遇到的问题。</p>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    <section class="row align-items-center mb-5">
                        <div class="col-lg-6 mb-4 mb-lg-0">
                            <img src="https://stage-ainotes-1257147670.cos.ap-beijing.myqcloud.com/ainotes/users/685e34795fd2daf6ed8c0c09/image/2025/7/image_1752141296635_1lmp79eqffv.jpg" crossorigin="anonymous" alt="产品展示" class="img-fluid rounded">
                        </div>
                        <div class="col-lg-6">
                            <h2>关于我们的产品</h2>
                            <p class="lead">我们提供创新的解决方案，帮助企业提升效率。</p>
                            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam euismod, nisi vel consectetur interdum, nisl nisi consectetur purus, eget porttitor nisl nisl sit amet magna. Nulla facilisi.</p>
                            <button class="btn btn-primary">了解更多</button>
                        </div>
                    </section>
                    
                    <section class="text-center mb-5">
                        <h2 class="mb-4">我们的客户</h2>
                        <div class="row">
                            <div class="col-md-2 col-4 mb-4">
                                <img src="https://stage-ainotes-1257147670.cos.ap-beijing.myqcloud.com/ainotes/users/685e34795fd2daf6ed8c0c09/image/2025/7/image_1752141296635_1lmp79eqffv.jpg" crossorigin="anonymous" alt="客户Logo" class="img-fluid">

            // 添加自定义CSS
            editor.setStyle(`
                body {
                    font-family: 'Arial', sans-serif;
                    color: #333;
                    line-height: 1.6;
                }
                
                .card {
                    transition: transform 0.3s ease, box-shadow 0.3s ease;

                    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
                }
                
                .card:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 10px 20px rgba(0,0,0,0.1);

                    color: #4CAF50 !important;
                }
                
                .btn-primary {
                    background-color: #4CAF50;
                    border-color: #4CAF50;

                }
                
                .btn-primary:hover {
                    background-color: #45a049;
                    border-color: #45a049;
                }

                footer a:hover {

            `);

            // 响应式设计视图切换
            var deviceButtons = document.querySelectorAll('.device-btn');
            deviceButtons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var device = this.getAttribute('data-device');
                    editor.setDevice(device);
                    
                    // 更新按钮状态
                    deviceButtons.forEach(function(el) {
                        el.classList.remove('active');
                    });
                    this.classList.add('active');
                });
            });

            // 查看代码按钮
            document.getElementById('view-code').addEventListener('click', function() {
                var htmlCode = editor.getHtml();
                var cssCode = editor.getCss();
                var fullCode = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>GrapesJS 生成的页面</title>\n    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">\n    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">\n    <style>\n' + cssCode + '\n    </style>\n</head>\n<body>\n' + htmlCode + '\n    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"><\/script>\n</body>\n</html>';
                
                document.getElementById('code-display').textContent = htmlCode;
                document.getElementById('code-viewer').style.display = 'flex';
                
                // 代码标签切换
                var activeTab = 'html';
                var codeTabs = document.querySelectorAll('.code-tab');
                codeTabs.forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        var tabId = this.getAttribute('data-tab');
                        
                        // 更新标签状态
                        codeTabs.forEach(function(el) {
                            el.classList.remove('active');
                        });
                        this.classList.add('active');
                        
                        // 更新代码显示
                        if (tabId === 'html') {
                            document.getElementById('code-display').textContent = htmlCode;
                        } else if (tabId === 'css') {
                            document.getElementById('code-display').textContent = cssCode;
                        } else if (tabId === 'full') {
                            document.getElementById('code-display').textContent = fullCode;
                        }
                    });
                });
            });
            
            // 关闭代码查看器
            document.querySelector('.close-btn').addEventListener('click', function() {
                document.getElementById('code-viewer').style.display = 'none';
            });
            
            // 清空画布按钮
            document.getElementById('clear-canvas').addEventListener('click', function() {
                if (confirm('确定要清空画布吗？')) {
                    editor.runCommand('core:canvas-clear');
                }
            });

            // ====== 本地保存/加载 ======
            var STORAGE_KEY = 'grapesjs_project_v1';
            document.getElementById('save-project').addEventListener('click', function() {
                var data = editor.getProjectData();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                alert('已保存到浏览器本地');
            });
            document.getElementById('load-project').addEventListener('click', function() {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) {
                    alert('未找到本地草稿');
                    return;
                }
                try {
                    var data = JSON.parse(raw);
                    editor.loadProjectData(data);
                } catch (e) {
                    alert('草稿解析失败');
                }
            });

            // ====== 下载完整 HTML 文件 ======
            document.getElementById('download-html').addEventListener('click', function() {
                var htmlCode = editor.getHtml();
                var cssCode = editor.getCss();
                var fullCode = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>导出的页面</title>\n    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">\n    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">\n    <style>\n' + cssCode + '\n    </style>\n</head>\n<body>\n' + htmlCode + '\n    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"><\/script>\n</body>\n</html>';
                var blob = new Blob([fullCode], { type: 'text/html;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'grapesjs_export.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // ====== 下载 PDF ======
            document.getElementById('download-pdf').addEventListener('click', function() {
                (async function run() {
                    if (typeof window.html2pdf === 'undefined') {
                        try { await loadScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'); } catch(e) {}
                    }
                    var htmlCode = editor.getHtml();
                    var cssCode = editor.getCss();
                    // 为图片添加跨域属性，提升 CORS 兼容性
                    htmlCode = htmlCode.replace(/<img\s/gi, '<img crossorigin="anonymous" referrerpolicy="no-referrer" ');

                    // 方式一：在 iframe(srcdoc) 中渲染完整文档，更稳定
                    var fullHtml = '<!DOCTYPE html>' +
                        '<html lang="zh-CN"><head>' +
                        '<meta charset="UTF-8">' +
                        '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
                        '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">' +
                        '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">' +
                        '<style>' + cssCode + '</style>' +
                        '</head><body>' + htmlCode + '</body></html>';

                    var iframe = document.createElement('iframe');
                    iframe.style.position = 'fixed';
                    iframe.style.left = '0';
                    iframe.style.top = '0';
                    iframe.style.width = '1000px';
                    iframe.style.height = '1400px';
                    iframe.style.opacity = '0';
                    iframe.style.zIndex = '-1';
                    iframe.setAttribute('aria-hidden', 'true');
                    // 使用 srcdoc 保持同源，便于 html2canvas 读取
                    iframe.srcdoc = fullHtml;
                    document.body.appendChild(iframe);

                    function cleanup() { try { document.body.removeChild(iframe); } catch(_){} }

                    var opt = {
                        margin:       10,
                        filename:     'grapesjs_export.pdf',
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true, allowTaint: false },
                        jsPDF:        { unit: 'pt', format: 'a4', orientation: 'portrait' }
                    };

                    try {
                        await new Promise(function(resolve){ iframe.onload = resolve; });
                        var target = iframe.contentDocument && iframe.contentDocument.body ? iframe.contentDocument.body : null;
                        if (!target) throw new Error('iframe 未就绪');
                        await window.html2pdf().set(opt).from(target).save();
                        cleanup();
                    } catch (e) {
                        console.warn('PDF 主路径失败，尝试安全模式导出', e);
                        cleanup();
                        // 方式二（安全模式）：替换远程图片为内联占位，使用当前文档离屏容器
                        var container = document.createElement('div');
                        container.style.position = 'fixed';
                        container.style.left = '0';
                        container.style.top = '0';
                        container.style.width = '900px';
                        container.style.opacity = '0';
                        container.innerHTML = '<style>' + cssCode + '</style>' + htmlCode;
                        document.body.appendChild(container);
                        replaceImagesWithInlinePlaceholders(container);
                        try {
                            await window.html2pdf().set(opt).from(container).save();
                        } finally {
                            document.body.removeChild(container);
                        }
                    }
                })();
            });

            // ====== 下载 Word (DOCX) ======
            document.getElementById('download-docx').addEventListener('click', function() {
                (async function run() {
                    if (!window.htmlDocx || !window.htmlDocx.asBlob) {
                        try { await loadScript('https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js'); } catch(e) {}
                    }
                    var htmlCode = editor.getHtml();
                    var cssCode = editor.getCss();
                    // 离屏容器，替换远程图片
                    var container = document.createElement('div');
                    container.innerHTML = '<style>' + cssCode + '</style>' + htmlCode;
                    replaceImagesWithInlinePlaceholders(container);
                    var docContent = '<!DOCTYPE html>\n<html><head><meta charset="UTF-8"></head><body>' + container.innerHTML + '</body></html>';

                    try {
                        var blob = (window.htmlDocx && window.htmlDocx.asBlob) ? window.htmlDocx.asBlob(docContent) : null;
                        if (!blob) throw new Error('html-docx-js 加载失败');
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = 'grapesjs_export.docx';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    } catch (e) {
                        alert('Word 导出失败，请检查网络或稍后再试');
                        console.error('DOCX 导出失败', e);
                    }
                })();
            });

            // ====== 下载 PDF（服务端高保真，需先启动 server） ======
            document.getElementById('download-pdf-server').addEventListener('click', function() {
                (async function run() {
                    var htmlCode = editor.getHtml();
                    var cssCode = editor.getCss();
                    var fullCode = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">\n    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">\n    <style>\n' + cssCode + '\n    </style>\n</head>\n<body>\n' + htmlCode + '\n    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"><\/script>\n</body>\n</html>';
                    try {
                        var resp = await fetch('http://localhost:3000/pdf', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ html: fullCode, options: { format: 'A4', printBackground: true } })
                        });
                        if (!resp.ok) throw new Error('生成失败: ' + resp.status);
                        var blob = await resp.blob();
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = 'grapesjs_export_server.pdf';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    } catch (e) {
                        alert('连接生成服务失败，请先在 server 目录启动服务：npm i && node index.js');
                        console.error(e);
                    }
                })();
            });
        });
    </script>
</body>
</html>
